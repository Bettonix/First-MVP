# ─── DevSecOps QA Stack — First MVP ──────────────────────────────────────────
#
# ARQUITETURA:
#   - next-app: builda e serve o Next.js dentro da rede Docker (porta 3000)
#   - playwright: aguarda next-app healthy, roda testes E2E apontando para ele
#   - sonarqube: servidor de análise estática (porta 9000)
#   - sonar-scanner: analisa o código e envia para o sonarqube
#   - security-scan: Trivy varre dependências por CVEs HIGH/CRITICAL
#
# SCRIPTS:
#   npm run qa:e2e    → sobe next-app + playwright (profile: e2e)
#   npm run qa:scan   → sobe sonarqube + sonar-scanner + trivy (profile: scan)
#   npm run qa:local  → tudo junto
#   npm run qa:clean  → derruba e limpa volumes
#
# PRÉ-REQUISITO:
#   Copie .env.example → .env.qa e preencha as variáveis do Supabase.
#   SONAR_TOKEN deve estar definido no ambiente do host.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Next.js App (target de testes E2E) ────────────────────────────────────
  next-app:
    image: node:20-slim
    container_name: first-mvp-next-app
    working_dir: /app
    volumes:
      - .:/app
      - next_node_modules:/app/node_modules
      - next_build_cache:/app/.next
    env_file:
      - .env.qa
    environment:
      NODE_ENV: production
      PLAYWRIGHT_TEST_BYPASS: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    command: >
      sh -c "npm install --prefer-offline --no-audit &&
             npx next build &&
             npx next start -p 3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000 | grep -q 'html'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s
    profiles:
      - e2e

  # ── 2. Playwright E2E ────────────────────────────────────────────────────────
  playwright:
    image: mcr.microsoft.com/playwright:v1.50.0-jammy
    container_name: first-mvp-playwright
    depends_on:
      next-app:
        condition: service_healthy
    # ipc: host evita OOM do Chrome em containers com memória limitada
    ipc: host
    working_dir: /app
    volumes:
      - .:/app
      - playwright_node_modules:/app/node_modules
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    environment:
      BASE_URL: http://next-app:3000
      CI: "true"
      PLAYWRIGHT_TEST_BYPASS: "1"
    command: >
      sh -c "npm install --prefer-offline --no-audit &&
             npx playwright install chromium &&
             npx playwright test --reporter=line"
    profiles:
      - e2e

  # ── 3. SonarQube ─────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:lts-community
    container_name: first-mvp-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    profiles:
      - scan

  # ── 4. Sonar Scanner ─────────────────────────────────────────────────────────
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: first-mvp-sonar-scanner
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - .:/usr/src
      - sonar_cache:/opt/sonar-scanner/.sonar/cache
    working_dir: /usr/src
    command: >
      -Dsonar.host.url=http://sonarqube:9000
      -Dsonar.token=${SONAR_TOKEN}
    profiles:
      - scan

  # ── 5. Security Scan (Trivy) ─────────────────────────────────────────────────
  security-scan:
    image: aquasec/trivy:latest
    container_name: first-mvp-trivy
    volumes:
      - .:/project:ro
      - trivy_cache:/root/.cache/trivy
    # exit-code 1 → falha a esteira se achar HIGH ou CRITICAL
    command: >
      fs
      --severity HIGH,CRITICAL
      --exit-code 1
      --no-progress
      --ignore-unfixed
      /project
    profiles:
      - scan

volumes:
  next_node_modules:
  next_build_cache:
  playwright_node_modules:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_cache:
  trivy_cache:

# SonarQube — First MVP PDV
# Servidor: http://localhost:9000 (infra-sonarqube)
# Execução: npm run sonar (requer SONAR_TOKEN no ambiente)

sonar.projectKey=first-mvp
sonar.projectName=First MVP PDV
sonar.projectVersion=1.0

sonar.sources=src
sonar.exclusions=**/node_modules/**, **/.next/**, **/tests/**, **/*.spec.ts, playwright.config.ts, **/*.css

sonar.host.url=http://localhost:9000

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Cobertura (opcional — gerar com: npx jest --coverage)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
